output_dir: "${SCRATCH}/synthetic-sft-sources/pools"
raw_dir: "${SCRATCH}/synthetic-sft-sources/raw"

sources:
  # Current RL-priming pools: deliberately easy, answer-extractable tasks.
  - name: reasoning-gym-basic
    kind: reasoning_gym
    num_samples: 300000
    seed: 47
    workers: 64
    task_chunk_size: 1000
    difficulty_weights: {easy: 1.0}
    task_groups:
      math:
        weight: 0.50
        tasks:
          - simple_geometry
          - calendar_arithmetic
          - decimal_arithmetic
          - dice
          - fraction_simplification
          - gsm_symbolic
          - number_format
          - prime_factorization
          - time_intervals
      logic:
        weight: 0.35
        tasks:
          - course_schedule
          - family_relationships
          - path_star
          - shortest_path
          - knights_knaves
          - syllogism
      puzzles:
        weight: 0.15
        tasks:
          - boxnet
          - maze
          - n_queens
          - tower_of_hanoi

  - name: numina-basic
    raw_name: AI-MO/NuminaMath-CoT
    kind: numina
    repo_id: AI-MO/NuminaMath-CoT
    allow_patterns:
      - data/train-*.parquet
    # These are elementary word-problem sources. CN K-12 and synthetic-math
    # contain substantial difficult tails even when their solutions are short.
    allowed_sources: [gsm8k, orca_math]
    require_boxed_answer: true
    max_problem_chars: 2000
    max_solution_chars: 4000
    excluded_prompt_markers:
      - prove that
      - show that
      - provide a proof
      - demonstrate that

  # Superseded first pass, retained so the initial easy-source pilot is reproducible.
  - name: reasoning-gym-easy
    kind: reasoning_gym
    num_samples: 400000
    seed: 45
    workers: 64
    task_chunk_size: 1000
    difficulty_weights: {easy: 1.0}
    task_groups:
      math:
        weight: 0.45
        tasks:
          - complex_arithmetic
          - polynomial_equations
          - polynomial_multiplication
          - simple_geometry
          - calendar_arithmetic
          - decimal_arithmetic
          - dice
          - fraction_simplification
          - gsm_symbolic
          - power_function
          - prime_factorization
          - time_intervals
      logic:
        weight: 0.35
        tasks:
          - course_schedule
          - family_relationships
          - path_star
          - shortest_path
          - knights_knaves
          - propositional_logic
          - syllogism
      puzzles:
        weight: 0.20
        tasks:
          - boxnet
          - kakurasu
          - maze
          - n_queens
          - survo
          - tower_of_hanoi

  - name: numina-easy
    raw_name: AI-MO/NuminaMath-CoT
    kind: numina
    repo_id: AI-MO/NuminaMath-CoT
    allow_patterns:
      - data/train-*.parquet
    allowed_sources: [gsm8k, orca_math, synthetic_math, cn_k12]
    require_boxed_answer: true
    max_problem_chars: 4000
    max_solution_chars: 12000
    excluded_prompt_markers:
      - prove that
      - show that
      - provide a proof
      - demonstrate that

  # Historical source pools retained for reproducibility of earlier pilots.
  - name: reasoning-gym
    kind: reasoning_gym
    # Headroom above the 250K needed by a one-million-row launch at this source share.
    num_samples: 350000
    seed: 42
    workers: 256
    task_chunk_size: 50
    difficulty_weights: {easy: 0.15, medium: 0.35, hard: 0.50}
    task_groups:
      core:
        weight: 0.60
        tasks:
          - complex_arithmetic
          - polynomial_equations
          - polynomial_multiplication
          - advanced_geometry
          - simple_geometry
          - calendar_arithmetic
          - decimal_arithmetic
          - dice
          - fraction_simplification
          - gsm_symbolic
          - number_format
          - power_function
          - prime_factorization
          - time_intervals
          - course_schedule
          - family_relationships
          - largest_island
          - path_star
          - shortest_path
          - acre
          - list_functions
          - knights_knaves
          - propositional_logic
          - self_reference
          - syllogism
          - zebra_puzzles
          - coin_flip
      algorithmic:
        weight: 0.30
        tasks:
          - binary_matrix
          - count_bits
          - cryptarithm
          - game_of_life
          - graph_color
          - manipulate_matrix
          - rotate_matrix
          - spiral_matrix
          - string_manipulation
          - string_synthesis
      puzzles:
        weight: 0.10
        tasks:
          - boxnet
          - kakurasu
          - maze
          - mini_sudoku
          - n_queens
          - survo
          - tower_of_hanoi
  - name: deepscaler
    raw_name: agentica-org/DeepScaleR-Preview-Dataset
    kind: deepscaler
    repo_id: agentica-org/DeepScaleR-Preview-Dataset
    allow_patterns:
      - deepscaler.json

  - name: deepmath
    raw_name: zwhe99/DeepMath-103K
    kind: deepmath
    repo_id: zwhe99/DeepMath-103K
    allow_patterns:
      - data/*.parquet

  - name: openmath
    raw_name: nvidia/OpenMathReasoning
    kind: openmath
    repo_id: nvidia/OpenMathReasoning
    allow_patterns:
      - data/*.parquet

  - name: openthoughts
    raw_name: open-thoughts/OpenThoughts3-1.2M
    kind: openthoughts
    repo_id: open-thoughts/OpenThoughts3-1.2M
    allow_patterns:
      - data/*.parquet
