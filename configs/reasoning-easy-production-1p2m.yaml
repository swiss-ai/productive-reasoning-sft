# Launch candidate only. Do not submit until the easy-task quality pilot and a
# multi-node resume/scale soak have passed manual review.
run:
  run_id: reasoning-easy-qwen36-1p2m-v1
  output_dir: ../runs
  seed: 47
  resume: true

source:
  adapter: pool
  # Two independent rollouts over 600K unique, easy prompts.
  num_samples: 600000
  system_prompt: null
  params:
    sources:
      - path: "${SCRATCH}/synthetic-sft-sources/pools/numina-easy/prompts"
        weight: 0.60
        subsets: [gsm8k, orca_math, synthetic_math, cn_k12]
        difficulty_weights: {easy: 1.0}
      - path: "${SCRATCH}/synthetic-sft-sources/pools/reasoning-gym-easy/prompts"
        weight: 0.40
        difficulty_weights: {easy: 1.0}

model:
  model_source: /capstor/store/cscs/swissai/infra01/hf_models/models/Qwen/Qwen3.6-35B-A3B-FP8
  execution: continuous
  inflight_candidates: 32
  dtype: auto
  tensor_parallel_size: 1
  max_model_len: 24576
  gpu_memory_utilization: 0.90
  max_num_seqs: 64
  max_num_batched_tokens: 4096
  enable_prefix_caching: true
  batch_size: 1024
  sampling:
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    max_tokens: 8192
    presence_penalty: 1.5
    reasoning_effort: null

generation:
  rollouts_per_prompt: 2
  polish: true
  polish_max_tokens: 4096

quality:
  verifier_threshold: 1.0
  judge:
    enabled: true
    model_source: null
    batch_size: 1024
    max_tokens: 768
    analysis_samples: 2
    analysis_max_tokens: 2048
    hygiene_max_tokens: 768
    reasoning_effort: null
    rubric_version: 10

output:
  parquet_target_mb: 256
  compression: zstd
  prepared_shards_per_gpu: 1
  checkpoint_rows: 256
  checkpoint_seconds: 300

slurm:
  nodes: 20
  gpus_per_node: 4
  cpus_per_node: 288
  # Preemptable permits at most 24 hours. Requeue before the limit and resume
  # from atomic candidate checkpoints until all 1.2M candidates are complete.
  time: "24:00:00"
  partition: preemptable
  account: infra01
  qos: null
  exclusive: true
  requeue: true
  requeue_before_timeout_seconds: 300
  environment: ../container/cscs.toml
  image: "${SCRATCH}/images/synthetic-sft-v0.6.sqsh"
