# Launch candidate only. Do not submit until the bounded-polish calibration and
# multi-node resume/scale soak have passed manual review.
run:
  run_id: reasoning-productive-easy-qwen36-1p89m-v1
  output_dir: ../runs
  seed: 47
  resume: true

source:
  adapter: pool
  # Nine independent rollouts over 210K unique elementary prompts (1.89M
  # candidates). This is sized for the intended roughly 1,000 node-hour launch, with the final wall
  # estimate taken from the multi-node soak rather than assumed linear scaling.
  num_samples: 210000
  system_prompt: null
  params:
    sources:
      - path: "${SCRATCH}/synthetic-sft-sources/pools/numina-basic/prompts"
        # Keep the full finite GSM8K slice; exclude the much noisier Orca tail.
        weight: 0.015
        subsets: [gsm8k]
        difficulty_weights: {easy: 1.0}
      - path: "${SCRATCH}/synthetic-sft-sources/pools/reasoning-gym-production-v3/prompts"
        weight: 0.985
        # Exclude path_star: real calibration showed frequent teacher rabbit holes and
        # inconsistent productivity judgments even after the dedicated critique.
        subsets:
          - calendar_arithmetic
          - fraction_simplification
          - gsm_symbolic
          - knights_knaves
          - time_intervals
        difficulty_weights: {easy: 1.0}

model:
  model_source: /capstor/store/cscs/swissai/infra01/hf_models/models/Qwen/Qwen3.6-35B-A3B-FP8
  execution: continuous
  inflight_candidates: 32
  dtype: auto
  tensor_parallel_size: 1
  max_model_len: 24576
  gpu_memory_utilization: 0.90
  max_num_seqs: 64
  max_num_batched_tokens: 4096
  enable_prefix_caching: true
  batch_size: 1024
  sampling:
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    max_tokens: 8192
    presence_penalty: 1.5
    reasoning_effort: null

generation:
  mode: direct_polish
  rollouts_per_prompt: 9
  polish: true
  polish_max_tokens: 4096

quality:
  verifier_threshold: 1.0
  judge:
    enabled: true
    model_source: null
    batch_size: 1024
    max_tokens: 1024
    analysis_samples: 2
    analysis_max_tokens: 1024
    hygiene_max_tokens: 768
    reasoning_effort: null
    rubric_version: 19

output:
  parquet_target_mb: 256
  compression: zstd
  prepared_shards_per_gpu: 1
  checkpoint_rows: 256
  checkpoint_seconds: 300

slurm:
  nodes: 20
  gpus_per_node: 4
  cpus_per_node: 288
  # Preemptable permits at most 24 hours. Requeue before the limit and resume
  # from atomic candidate checkpoints until all 1.89M candidates are complete.
  time: "24:00:00"
  partition: preemptable
  account: infra01
  qos: null
  exclusive: true
  requeue: true
  requeue_before_timeout_seconds: 300
  environment: ../container/cscs.toml
  image: "${SCRATCH}/images/synthetic-sft-v0.20.sqsh"
