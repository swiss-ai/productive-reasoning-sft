image = "${SFT_IMAGE}"
mounts = ["${SCRATCH}:${SCRATCH}", "${PROJECT}:${PROJECT}"]
workdir = "${SFT_PROJECT_DIR}"

[env]
PYTHONPATH = "${SFT_PROJECT_DIR}/src:${PYTHONPATH:-}"
HF_HOME = "${SCRATCH}/.cache/huggingface"
VLLM_CACHE_ROOT = "${SCRATCH}/.cache/synthetic-sft/vllm"
TRITON_CACHE_DIR = "${SCRATCH}/.cache/synthetic-sft/triton"
FLASHINFER_WORKSPACE_BASE = "${SCRATCH}/.cache/synthetic-sft"
CUDA_CACHE_PATH = "${SCRATCH}/.cache/synthetic-sft/cuda"
RAY_TMPDIR = "/tmp/ray_${SLURM_JOB_ID}"
TOKENIZERS_PARALLELISM = "true"
RAY_USAGE_STATS_ENABLED = "0"
RAY_DEDUP_LOGS = "0"
